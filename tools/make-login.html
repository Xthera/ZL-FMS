<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make a ZL FMS login</title>
<style>
  :root { color-scheme: dark; --bg: #0a0f15; --card: #101821; --line: #2a3947; --text: #edf2f6; --muted: #8b98a5; --accent: #8fb6d9; --bad: #e17e84; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(100%, 560px); display: grid; gap: 14px; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  label { display: grid; gap: 6px; }
  label span { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 84px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; resize: vertical; }
  button { height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .error { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Make a ZL FMS login</h1>
  <p>Turns a login ID and password into one line for <code>js/auth-users.js</code>. The password is only scrambled here, on this computer; it isn't sent or saved anywhere.</p>

  <form id="form" class="grid" autocomplete="off" style="display:grid;gap:14px">
    <label><span>Login ID</span><input id="id" required autocapitalize="none" spellcheck="false" placeholder="e.g. jane"></label>
    <label><span>Password (at least 10 characters)</span><input id="pw" type="password" required autocomplete="new-password"></label>
    <label><span>Type the password again</span><input id="pw2" type="password" required autocomplete="new-password"></label>
    <p id="error" class="error" hidden></p>
    <div class="row"><button id="make" type="submit">Make login line</button></div>
  </form>

  <div id="result" hidden style="display:grid;gap:10px">
    <label><span>Paste this line into js/auth-users.js</span><textarea id="line" readonly></textarea></label>
    <div class="row"><button id="copy" type="button">Copy</button></div>
    <p>Inside <code>USERS = { … }</code>: add it as a new line, or replace that ID's old line to change the password. Then commit and push.</p>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const ITERATIONS = 210000;
  const toBase64 = bytes => btoa(String.fromCharCode(...bytes));

  $("form").addEventListener("submit", async event => {
    event.preventDefault();
    const id = $("id").value.trim().toLowerCase();
    const pw = $("pw").value;
    const error = text => { $("error").textContent = text; $("error").hidden = !text; };
    error("");
    if (!/^[a-z0-9._@-]{2,40}$/.test(id)) return error("Login ID: 2–40 letters, numbers, dots, dashes, underscores or @.");
    if (pw.length < 10) return error("Use a password of at least 10 characters.");
    if (pw !== $("pw2").value) return error("The two passwords don't match.");
    if (!window.crypto?.subtle) return error("This browser can't do it here. Open this page from the dashboard's website instead.");

    $("make").disabled = true;
    try {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: ITERATIONS }, key, 256));
      $("line").value = `    "${id}": { salt: "${toBase64(salt)}", hash: "${toBase64(bits)}", iterations: ${ITERATIONS} },`;
      $("result").hidden = false;
      $("pw").value = $("pw2").value = "";
    } finally {
      $("make").disabled = false;
    }
  });

  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("line").value); $("copy").textContent = "Copied"; }
    catch { $("line").select(); }
    setTimeout(() => { $("copy").textContent = "Copy"; }, 1500);
  });
</script>
</body>
</html>
